<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishShield</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: #202124;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e8eaed;
    }

    .header img {
      width: 28px;
      height: 28px;
    }

    .header-text h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #1a73e8;
    }

    .header-text p {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: #5f6368;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #1a73e8;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s, opacity 0.2s;
    }

    #scanBtn {
      background-color: #1a73e8;
      color: #ffffff;
    }

    #scanBtn:hover {
      background-color: #1557b0;
    }

    #currentTabBtn {
      background-color: #f1f3f4;
      color: #3c4043;
    }

    #currentTabBtn:hover {
      background-color: #e8eaed;
    }

    #result {
      display: none;
      margin-top: 14px;
      padding: 12px;
      background-color: #f8f9fa;
      border: 1px solid #e8eaed;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="icons/icon48.png" alt="PhishShield Logo">
    <div class="header-text">
      <h2>PhishShield</h2>
      <p>Real-Time Phishing Threat Detector</p>
    </div>
  </div>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="Enter or paste URL to scan..." />
    <div class="button-group">
      <button id="currentTabBtn" type="button">Use Active Tab</button>
      <button id="scanBtn" type="button">Scan URL</button>
    </div>
  </div>

  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
