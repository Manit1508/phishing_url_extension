<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>🛡️ PhishShield</h2>
    <p>Check if a link is safe before opening it.</p>
    
    <input type="text" id="url-input" placeholder="https://example.com" />
    <button id="scan-btn">Scan URL</button>
    <button id="current-tab-btn" class="secondary">Use Current Tab</button>

    <div id="result" class="hidden">
      <h3 id="verdict"></h3>
      <p id="probability" style="font-size: 11px; margin: 4px 0 8px; color: #64748b;"></p>
      <ul id="reasons"></ul>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
